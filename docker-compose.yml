services:
  app:
    build: .
    image: zotero-arxiv-daily:latest
    # Secrets are injected from .env (ZOTERO_ID, ZOTERO_KEY, SENDER,
    # SENDER_PASSWORD, RECEIVER, OPENAI_API_KEY, OPENAI_API_BASE).
    env_file:
      - .env
    environment:
      - HF_HOME=/app/models
      - TOKENIZERS_PARALLELISM=false
      - TZ=Asia/Shanghai
      # Daily schedule in UTC (arXiv releases ~00:00-01:00 UTC).
      - CRON_SCHEDULE=30 1 * * *
      # Retry when 0 papers are retrieved on a weekday.
      - RETRY_MINUTES=20
      - MAX_RETRIES=4
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    restart: unless-stopped
